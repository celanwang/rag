name: rag-dev
services:
  postgres:
    image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?Set RAG_POSTGRES_PASSWORD}
      RAG_API_PASSWORD: ${RAG_API_PASSWORD:?Set RAG_API_PASSWORD}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:?Set RAG_ADMIN_PASSWORD}
      RAG_WORKER_PASSWORD: ${RAG_WORKER_PASSWORD:?Set RAG_WORKER_PASSWORD}
      RAG_SYNC_PASSWORD: ${RAG_SYNC_PASSWORD:?Set RAG_SYNC_PASSWORD}
    ports:
      - "127.0.0.1:${RAG_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ingestion.sql:/docker-entrypoint-initdb.d/02-ingestion.sql:ro
      - ./sync.sql:/docker-entrypoint-initdb.d/03-sync.sql:ro
      - ./retrieval.sql:/docker-entrypoint-initdb.d/04-retrieval.sql:ro
      - ./retention.sql:/docker-entrypoint-initdb.d/05-retention.sql:ro
      - ./audit.sql:/docker-entrypoint-initdb.d/06-audit.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "rag"]
      interval: 3s
      timeout: 3s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.16@sha256:ac2ab63eabaec668d1b00ceaeeea56fad5919068a3bde40c4ca8f16b3f414e8b
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${RAG_ES_PORT:-59201}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"]
      interval: 3s
      timeout: 4s
      retries: 40
volumes:
  postgres-data:
  elasticsearch-data:
